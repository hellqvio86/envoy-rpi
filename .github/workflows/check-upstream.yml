---
name: Check Upstream Envoy Releases

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-upstream-envoy
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fetch latest stable envoyproxy/envoy release
        id: upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          CURRENT="$(tr -d '[:space:]' < VERSION)"
          LATEST="$(curl -fsSL https://api.github.com/repos/envoyproxy/envoy/releases/latest | jq -er '.tag_name')"
          if [[ ! "${LATEST}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Error: Upstream API returned unexpected tag '${LATEST}'." >&2
            exit 1
          fi
          echo "current=${CURRENT}" >> "${GITHUB_OUTPUT}"
          echo "latest=${LATEST}" >> "${GITHUB_OUTPUT}"
          echo "Current: ${CURRENT}, Upstream latest: ${LATEST}"

      - name: Create or update PR if a new version is available
        if: steps.upstream.outputs.latest != steps.upstream.outputs.current
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          LATEST="${{ steps.upstream.outputs.latest }}"
          BRANCH="chore/envoy-${LATEST}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ "${HAS_RELEASE_PR_TOKEN}" != "true" ]]; then
            echo "⚠️ Warning: RELEASE_PR_TOKEN is not set; PRs created with GITHUB_TOKEN may not trigger PR CI workflows." >&2
          fi

          git fetch origin main
          git checkout -B "${BRANCH}" origin/main

          printf '%s\n' "${LATEST}" > VERSION
          if ! git diff --quiet VERSION; then
            git add VERSION
            git commit -m "chore: bump Envoy to ${LATEST}"
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            git push --force-with-lease -u origin "${BRANCH}"
          else
            git push -u origin "${BRANCH}"
          fi

          if gh pr list --repo "${{ github.repository }}" --head "${BRANCH}" --state open --json number -q '.[0].number' | grep -qE '^[0-9]+$'; then
            echo "PR for ${BRANCH} already open."
          else
            gh pr create \
              --title "chore: bump Envoy to ${LATEST}" \
              --body "Automated bump to upstream Envoy release \`${LATEST}\`." \
              --base main \
              --head "${BRANCH}"
          fi
